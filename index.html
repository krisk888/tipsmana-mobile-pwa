<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mobile/favicon.svg?v=3" />
    <link rel="apple-touch-icon" href="/mobile/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tipsmana</title>
    <meta name="theme-color" content="#059669"/>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* ═══ SPLASH SCREEN — visible avant le mount Vue ═══ */
      #app-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: #06241b;
        color: #fff;
        font-family: 'Montserrat', -apple-system, sans-serif;
        transition: opacity 0.4s ease;
      }
      #app-splash.hide { opacity: 0; pointer-events: none; }
      .splash-logo {
        font-size: 48px; line-height: 1; margin-bottom: 12px;
      }
      .splash-title {
        font-size: 24px; font-weight: 800; letter-spacing: -0.5px;
        background: linear-gradient(135deg, #34d399, #059669);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .splash-sub {
        font-size: 13px; color: #6b7280; margin-top: 6px; font-weight: 500;
      }
      .splash-loader {
        margin-top: 24px;
        width: 32px; height: 32px;
        border: 3px solid rgba(16,185,129,0.15);
        border-top-color: #10b981;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-splash">
        <div class="splash-logo">🧾</div>
        <div class="splash-title">Tipsmana</div>
        <div class="splash-sub">L'App du Boss</div>
        <div class="splash-loader"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
